    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%;
            background-color: #0b192e; 
            color: #ccd6f6; 
            font-family: 'Kantumruy Pro', sans-serif; 
                        display: flex;
            flex-direction: column;
        
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
}
        main {
            flex-grow: 1;
                        display: flex;
            flex-direction: column;
        }
        #content-area {
            flex-grow: 1;
                        display: flex;
            flex-direction: column;
        }
        #message-container { 
                        display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            flex-grow: 1;
            padding: 2rem; 
            box-sizing: border-box; 
            text-align: center; 
        }
        .btn-outline { background-color: transparent; color: #64ffda; border: 1px solid #64ffda; }
        .btn-outline:hover { background-color: rgba(100, 255, 218, 0.1); }
        
        .wrapper {
          display: inline-flex;
          list-style: none;
        }
        .wrapper .icon {
          position: relative;
          background: #eef3f8;
          border-radius: 50%;
          margin: 5px;
          width: 40px;
          height: 40px;
          font-size: 16px;
                      display: flex;
          justify-content: center;
          align-items: center;
          flex-direction: column;
          box-shadow: 0 10px 10px rgba(0, 0, 0, 0.1);
          cursor: pointer;
          transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .wrapper .tooltip {
          position: absolute;
          top: 0;
          font-size: 12px;
          background: #fff;
          color: #fff;
          padding: 4px 7px;
          border-radius: 5px;
          box-shadow: 0 10px 10px rgba(0, 0, 0, 0.1);
          opacity: 0;
          pointer-events: none;
          transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .wrapper .tooltip::before {
          position: absolute;
          content: "";
          height: 8px;
          width: 8px;
          background: #fff;
          bottom: -3px;
          left: 50%;
          transform: translate(-50%) rotate(45deg);
          transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .wrapper .icon:hover .tooltip {
          top: -38px;
          opacity: 1;
          visibility: visible;
          pointer-events: auto;
        }
        .wrapper .icon:hover span,
        .wrapper .icon:hover .tooltip {
          text-shadow: 0px -1px 0px rgba(0, 0, 0, 0.1);
        }
        .wrapper .facebook:hover,
        .wrapper .facebook:hover .tooltip,
        .wrapper .facebook:hover .tooltip::before {
          background: #1877f2;
          color: #fff;
        }
        .wrapper .icon:hover, .wrapper .icon:hover i { color: #fff; }
        .wrapper .youtube:hover,
        .wrapper .youtube:hover .tooltip,
        .wrapper .youtube:hover .tooltip::before {
          background: #FF0000;
          color: #fff;
        }
        .wrapper .tiktok:hover,
        .wrapper .tiktok:hover .tooltip,
        .wrapper .tiktok:hover .tooltip::before {
          background: #010101;
          color: #fff;
        }
         .nav-button-animated {
          position: relative;
          z-index: 10;
                      display: flex;
          justify-content: center;
          align-items: center;
          gap: 0.5rem;
          padding: 0.5rem 1rem;
          overflow: hidden;
          border: 2px solid #64ffda;
          border-radius: 9999px;
          color: #ccd6f6;
          font-weight: 600;
          text-decoration: none;
          transition: color 0.7s ease;
        }
        .nav-button-animated::before {
          content: '';
          position: absolute;
          width: 100%;
          left: -100%;
          aspect-ratio: 1 / 1;
          background-color: #64ffda;
          border-radius: 50%;
          transition: all 0.7s ease;
          z-index: -1;
        }
        .nav-button-animated:hover::before {
          left: 0;
          transform: scale(1.5);
        }
        .nav-button-animated:hover {
          color: #0a192f;
        }
        .nav-button-animated svg {
          width: 1.25rem;
          height: 1.25rem;
          transition: transform 0.3s ease;
        }
        .nav-button-animated:hover svg {
          transform: rotate(90deg);
        }
    </style>
</head>
<body>

                </a>
                <div class="ml-4">
                    <h1 class="text-4xl font-bold text-slate-100">Trabek Prey</h1>
                    <ul class="wrapper -mt-2 -ml-2">
                      <a href="https://web.facebook.com/profile.php?id=100068154814209" target="_blank" class="icon facebook">
                        <span class="tooltip">Facebook</span>

                      </a>
                      <a href="https://youtube.com/@trabek_prey?si=D3VrDutio04tovOj" target="_blank" class="icon youtube">
                        <span class="tooltip">YouTube</span>
                        <span><i class="fab fa-youtube"></i></span>

                      <a href="https://www.tiktok.com/@_.trabekprey?_t=ZS-8zVgZGpt0iq&_r=1" target="_blank" class="icon tiktok">

            <nav id="nav-loggedIn" class="hidden md:flex items-center space-x-2">
                <a href="home.html" class="nav-button-animated">

                    <svg viewBox="0 0 16 19" xmlns="http://www.w3.org/2000/svg"><path d="M7 18C7 18.5523 7.44772 19 8 19C8.55228 19 9 18.5523 9 18H7ZM8.70711 0.292893C8.31658 -0.0976311 7.68342 -0.0976311 7.29289 0.292893L0.928932 6.65685C0.538408 7.04738 0.538408 7.68054 0.928932 8.07107C1.31946 8.46159 1.95262 8.46159 2.34315 8.07107L8 2.41421L13.6569 8.07107C14.0474 8.46159 14.6805 8.46159 15.0711 8.07107C15.4616 7.68054 15.4616 7.04738 15.0711 6.65685L8.70711 0.292893ZM9 18L9 1H7L7 18H9Z"></path></svg>
                </a>
                <a href="dashboard.html" class="nav-button-animated">
                    <span>Tools បានទិញ</span>
                    <svg viewBox="0 0 16 19" xmlns="http://www.w3.org/2000/svg"><path d="M7 18C7 18.5523 7.44772 19 8 19C8.55228 19 9 18.5523 9 18H7ZM8.70711 0.292893C8.31658 -0.0976311 7.68342 -0.0976311 7.29289 0.292893L0.928932 6.65685C0.538408 7.04738 0.538408 7.68054 0.928932 8.07107C1.31946 8.46159 1.95262 8.46159 2.34315 8.07107L8 2.41421L13.6569 8.07107C14.0474 8.46159 14.6805 8.46159 15.0711 8.07107C15.4616 7.68054 15.4616 7.04738 15.0711 6.65685L8.70711 0.292893ZM9 18L9 1H7L7 18H9Z"></path></svg>

                <div class="flex items-center space-x-4 pl-4">
                     <a href="./bank.html" id="user-balance-header" class="flex items-center space-x-2 text-cyan-400 cursor-pointer hover:text-cyan-300">

                    </a>
                    <a href="bank.html" id="header-user-info" class="hidden items-center gap-2 cursor-pointer group">
                        <div class="text-right">
                           <div id="header-user-name" class="text-sm font-semibold text-slate-200 truncate max-w-[100px] group-hover:text-cyan-400 transition-colors"></div>

                       </div>
                       <img id="header-user-avatar" src="https://w1.pngwing.com/pngs/743/500/png-transparent-circle-silhouette-logo-user-user-profile-green-facial-expression-nose-cartoon.png" alt="User Avatar" class="w-9 h-9 rounded-full border-2 border-slate-700 group-hover:border-cyan-400 transition-colors object-cover flex-shrink-0">
                   </a>

             <nav id="nav-loggedOut" class="hidden">

    <main>
        <div id="content-area">
            <div id="message-container">
                <p>កំពុងទាញយក និងត្រួតពិនិត្យសិទ្ធិ...</p>
            </div>
        </div>
    </main>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        // ធានាថា Persistence ត្រូវបានកំណត់នៅពេលចាប់ផ្តើម
        import { getAuth, onAuthStateChanged, signOut, initializeAuth, indexedDBLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBltRSApiTiafnF7LMWTx9Ct3bGa_D8YtE",
            authDomain: "user-management-app-96124.firebaseapp.com",
            projectId: "user-management-app-96124",
            storageBucket: "user-management-app-96124.firebasestorage.app",
            messagingSenderId: "43230371264",
            appId: "1:43230371264:web:ae72b6528e8d64ff47bc25",
            measurementId: "G-NE0TT29GBB"
            };
        const app = initializeApp(firebaseConfig);
        // កំណត់ persistence ច្បាស់លាស់ដើម្បីរក្សា session នៅពេលផ្លាស់ប្តូរទំព័រ
        const auth = initializeAuth(app, { persistence: indexedDBLocalPersistence });
        const db = getFirestore(app);

        const navLoggedIn = document.getElementById('nav-loggedIn');
        const navLoggedOut = document.getElementById('nav-loggedOut');
        const balanceAmount = document.getElementById('balance-amount');
        const logoutBtnHeader = document.getElementById('logout-btn-header');
        const headerUserInfo = document.getElementById('header-user-info');
        const headerUserName = document.getElementById('header-user-name');
        const headerUserEmail = document.getElementById('header-user-email');
        const headerUserAvatar = document.getElementById('header-user-avatar');

        let isAuthChecked = false; // Flag to ensure loadContent runs only once after auth check
        let hasAttemptedRedirect = false; // NEW FLAG

        onAuthStateChanged(auth, user => {
            // ប្រើ user.email ដើម្បីត្រួតពិនិត្យថាជាអ្នកប្រើប្រាស់ពិតប្រាកដ (មិនមែនអនាមិក)
            if (user && user.email) {
                // User is logged in
                navLoggedIn.classList.remove('hidden');
                navLoggedIn.classList.add('flex');
                navLoggedOut.classList.add('hidden');
                const userRef = doc(db, "users", user.uid);
                onSnapshot(userRef, (doc) => {
                    if(doc.exists()) {
                        balanceAmount.textContent = `$${(doc.data().balance || 0).toFixed(2)}`;
                    }
                });

                const displayName = localStorage.getItem('userDisplayName') || user.displayName || user.email.split('@')[0];
                const userEmail = localStorage.getItem('userEmail') || user.email;
                const photoURL = localStorage.getItem('userPhotoURL') || user.photoURL;

                headerUserName.textContent = displayName;
                headerUserEmail.textContent = userEmail;
                if(photoURL) {
                    headerUserAvatar.src = photoURL;
                }
                headerUserInfo.classList.remove('hidden');
                hasAttemptedRedirect = false; // Reset if user is successfully logged in

                if (!isAuthChecked) {
                    loadContent();
                }
                
            } else {
                 // User is logged out
                 navLoggedOut.classList.remove('hidden');
                 navLoggedIn.classList.add('hidden');
                 document.querySelector('#message-container p').textContent = "Redirecting to login...";
                 
                 // Use flag to prevent the timeout from running more than once
                 if (!hasAttemptedRedirect) {
                    hasAttemptedRedirect = true;
                    // Keep the 2000ms delay to satisfy the persistent requirement
                    setTimeout(() => {
                        // Double check before redirecting
                        if (!auth.currentUser || !auth.currentUser.email) {
                            window.location.href = new URL('home.html', window.location.href).href;
                        }
                    }, 2000); 
                 }
            }
            isAuthChecked = true;
        });

        logoutBtnHeader.addEventListener('click', () => {
             // សម្អាត local storage មុនពេលចុះឈ្មោះចេញ
            localStorage.removeItem('userDisplayName');
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userPhotoURL');
             signOut(auth)
        });

        async function loadContent() {
            const contentArea = document.getElementById('content-area');
            try {
                const params = new URLSearchParams(window.location.search);
                const orderId = params.get('orderId');
                const currentUserId = auth.currentUser?.uid;

                if (!currentUserId) {
                     // This should ideally not happen if onAuthStateChanged works correctly, 
                     // but acts as a final safeguard.
                     throw new Error("អ្នកត្រូវតែចូលគណនីរបស់អ្នកជាមុនសិន ទើបអាចមើលមាតិកានេះបាន។");
                }
                
                if (!orderId) {
                    throw new Error("រកមិនឃើញលេខសម្គាល់ទំនិញទេ។ មិនអាចបង្ហាញមាតិកាបានទេ។");
                }

                const orderRef = doc(db, 'users', currentUserId, 'orders', orderId);
                const orderSnap = await getDoc(orderRef);
                if (!orderSnap.exists()) {
                    throw new Error("រកមិនឃើញទំនិញដែលបានទិញ ឬអ្នកមិនមានសិទ្ធិចូលមើលទំព័រនេះទេ។");
                }
                
                const orderData = orderSnap.data();
                
                const status = orderData.status || 'active';
                const expiryDate = orderData.expiresAt?.toDate ? orderData.expiresAt.toDate() : null;
                const isExpired = expiryDate ? expiryDate < new Date() : false;
                
                if (status !== 'active') {
                     throw new Error(`សិទ្ធិប្រើប្រាស់របស់អ្នកត្រូវបាន ${status}។`);
                }
                if (isExpired) {
                    throw new Error("Tools នេះ អ្នកបានប្រើប្រាស់អស់រយៈពេលហើយ,​សូមធ្វើការទិញថ្មីដើម្បីបន្ត។");
                }

                if (!orderData.productId) {
                    throw new Error("ទិន្នន័យបញ្ជាទិញមិនត្រឹមត្រូវទេ។ មិនអាចបង្ហាញមាតិកាបានទេ។");
                }

                const productRef = doc(db, 'products', orderData.productId);
                const productSnap = await getDoc(productRef);
                if (!productSnap.exists()) {
                    throw new Error("រកមិនឃើញផលិតផលដើមសម្រាប់ការបញ្ជាទិញនេះទេ។");
                }
                const productData = productSnap.data();
                
                document.title = productData.name || "Content Viewer";
                const htmlContent = productData.htmlContent; 

                if (htmlContent) {
                    contentArea.innerHTML = '';
                    const iframe = document.createElement('iframe');
                    iframe.srcdoc = htmlContent;
                    iframe.className = "w-full h-full border-0 flex-grow";
                    contentArea.appendChild(iframe);
                } else {
                    throw new Error("រកមិនឃើញមាតិកាសម្រាប់ផលិតផលនេះទេ។");
                }
            } catch (error) {
                console.error("Error loading content:", error);
                contentArea.innerHTML = `<div id="message-container"><div class="text-center"><i class="fas fa-ban text-5xl text-red-400 mb-4"></i><h2 class="text-2xl font-bold text-red-400">Access Denied</h2><p class="mt-2">${error.message}</p></div></div>`;
            }
        }
    </script>

    <!-- SECURITY / ANTI-INSPECT SCRIPTS -->
    <script>
        // Disable Right-click
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
        });

        // Disable specific keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12') {
                e.preventDefault();
            }
            // Ctrl+Shift+I (Inspect)
            if (e.ctrlKey && e.shiftKey && e.key === 'I') {
                e.preventDefault();
            }
            // Ctrl+Shift+C (Inspect Element)
            if (e.ctrlKey && e.shiftKey && e.key === 'C') {
                e.preventDefault();
            }
            // Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.key === 'J') {
                e.preventDefault();
            }
            // Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
                e.preventDefault();
            }
            // Ctrl+S (Save Page)
            if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
            }
        });

        // Debugger Trap
        setInterval(function() {
            var start = performance.now();
            debugger;
            if (performance.now() - start > 100) {
                document.body.innerHTML = "Inspector is open! Please close it to continue.";
                window.location.reload();
            }
        }, 1000);
    </script>
